<section class="password-page">
  <div class="container password-shell">
    <aside class="password-sidebar">
      <div class="sidebar-card">
        <a routerLink="/my-profile" routerLinkActive="active-link" class="profile-nav-link">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="21" viewBox="0 0 20 21" fill="none">
              <path d="M16.6668 18.793H15.0002V17.1263C15.0002 15.7456 13.8809 14.6263 12.5002 14.6263H7.50016C6.11945 14.6263 5.00016 15.7456 5.00016 17.1263V18.793H3.3335V17.1263C3.3335 14.8251 5.19898 12.9596 7.50016 12.9596H12.5002C14.8013 12.9596 16.6668 14.8251 16.6668 17.1263V18.793ZM10.0002 11.293C7.23874 11.293 5.00016 9.05439 5.00016 6.29297C5.00016 3.53154 7.23874 1.29297 10.0002 1.29297C12.7616 1.29297 15.0002 3.53154 15.0002 6.29297C15.0002 9.05439 12.7616 11.293 10.0002 11.293ZM10.0002 9.6263C11.8411 9.6263 13.3335 8.13392 13.3335 6.29297C13.3335 4.45202 11.8411 2.95964 10.0002 2.95964C8.15921 2.95964 6.66683 4.45202 6.66683 6.29297C6.66683 8.13392 8.15921 9.6263 10.0002 9.6263Z" fill="currentColor"></path>
            </svg>
          </span>
          <span>My Profile</span>
        </a>

        <a routerLink="/change-password" routerLinkActive="active-link" class="profile-nav-link active-link" aria-current="page">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 17C11.4477 17 11 17.4477 11 18C11 18.5523 11.4477 19 12 19C12.5523 19 13 18.5523 13 18C13 17.4477 12.5523 17 12 17Z" fill="currentColor"></path>
              <path fill-rule="evenodd" clip-rule="evenodd" d="M6 10V8C6 4.68629 8.68629 2 12 2C15.3137 2 18 4.68629 18 8V10H19C20.1046 10 21 10.8954 21 12V20C21 21.1046 20.1046 22 19 22H5C3.89543 22 3 21.1046 3 20V12C3 10.8954 3.89543 10 5 10H6ZM8 8C8 5.79086 9.79086 4 12 4C14.2091 4 16 5.79086 16 8V10H8V8ZM5 12H19V20H5V12Z" fill="currentColor"></path>
              <path d="M15 14H17V16H15V14ZM7 14H9V16H7V14ZM11 14H13V16H11V14Z" fill="currentColor"></path>
            </svg>
          </span>
          <span>Change Password</span>
        </a>

        <button type="button" class="profile-nav-link logout-link" (click)="logout()">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="17" viewBox="0 0 16 17" fill="none">
              <path d="M11.5853 1.29242C11.5627 1.281 11.5375 1.27559 11.5121 1.27671C11.4867 1.27784 11.4621 1.28546 11.4405 1.29884C11.419 1.31223 11.4012 1.33093 11.389 1.35315C11.3767 1.37537 11.3704 1.40037 11.3705 1.42575V2.61464C11.3705 2.71649 11.4242 2.81093 11.5094 2.86649C11.927 3.12934 12.3134 3.43872 12.6612 3.78871C13.2668 4.39612 13.7427 5.10167 14.0741 5.88686C14.4169 6.69969 14.5926 7.57321 14.5908 8.45537C14.5908 9.34611 14.4167 10.2109 14.0741 11.0239C13.743 11.8079 13.2632 12.5204 12.6612 13.122C12.0612 13.7256 11.3492 14.2062 10.565 14.5368C9.75392 14.8813 8.88913 15.0554 8.00028 15.0554C7.11142 15.0554 6.24663 14.8813 5.43555 14.5368C4.65139 14.2062 3.93933 13.7256 3.33932 13.122C2.73731 12.5204 2.2575 11.8079 1.92641 11.0239C1.58361 10.2111 1.40791 9.33754 1.40976 8.45537C1.40976 7.56463 1.58383 6.69982 1.92641 5.88686C2.25788 5.10167 2.73379 4.39612 3.33932 3.78871C3.69116 3.43686 4.07634 3.12945 4.49114 2.86649C4.57817 2.81279 4.63002 2.71649 4.63002 2.61464V1.4239C4.63002 1.31279 4.51336 1.24242 4.41521 1.29057C1.82456 2.59427 0.0375864 5.26278 0.000550663 8.35537C-0.0512994 12.7776 3.56524 16.4517 7.98546 16.4609C12.4112 16.4702 16 12.8813 16 8.45352C16 5.32019 14.2038 2.60723 11.5853 1.29242ZM7.4077 9.34982H8.59285C8.67433 9.34982 8.74099 9.28315 8.74099 9.20167V0.609085C8.74099 0.527604 8.67433 0.460938 8.59285 0.460938H7.4077C7.32622 0.460938 7.25956 0.527604 7.25956 0.609085V9.20167C7.25956 9.28315 7.32622 9.34982 7.4077 9.34982Z" fill="#333333"></path>
            </svg>
          </span>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <section class="password-main">
      <div class="main-topbar">
        <h1>Change Password</h1>
      </div>

      <form class="password-form" (ngSubmit)="savePassword()">
        <section class="profile-card field-card">
          <div class="field-label">Current Password</div>
          <div class="password-input-wrap">
            <input [type]="showCurrentPassword ? 'text' : 'password'" [(ngModel)]="currentPassword" name="currentPassword" placeholder="••••••••" autocomplete="off" class="profile-input" />
            <button type="button" class="eye-btn" (click)="showCurrentPassword = !showCurrentPassword" [attr.aria-label]="showCurrentPassword ? 'Hide current password' : 'Show current password'">
              <svg *ngIf="!showCurrentPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12c1.8-5 6-8 10-8s8.2 3 10 8c-1.8 5-6 8-10 8s-8.2-3-10-8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"></circle>
              </svg>
              <svg *ngIf="showCurrentPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                <path d="M4.5 8.5C6.4 5.9 9 4 12 4c4 0 8.2 3 10 8-.7 1.9-1.7 3.5-3 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M9.9 9.9A3.2 3.2 0 0 0 9 12c0 1.7 1.3 3 3 3 .7 0 1.4-.2 2-.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              </svg>
            </button>
          </div>
        </section>

        <section class="profile-card field-card">
          <div class="field-label">New Password</div>
          <div class="password-input-wrap">
            <input [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="newPassword" name="newPassword" placeholder="••••••••" maxlength="15" autocomplete="off" class="profile-input" />
            <button type="button" class="eye-btn" (click)="showNewPassword = !showNewPassword" [attr.aria-label]="showNewPassword ? 'Hide new password' : 'Show new password'">
              <svg *ngIf="!showNewPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12c1.8-5 6-8 10-8s8.2 3 10 8c-1.8 5-6 8-10 8s-8.2-3-10-8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"></circle>
              </svg>
              <svg *ngIf="showNewPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                <path d="M4.5 8.5C6.4 5.9 9 4 12 4c4 0 8.2 3 10 8-.7 1.9-1.7 3.5-3 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M9.9 9.9A3.2 3.2 0 0 0 9 12c0 1.7 1.3 3 3 3 .7 0 1.4-.2 2-.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              </svg>
            </button>
          </div>
        </section>

        <section class="profile-card field-card">
          <div class="field-label">Confirm Password</div>
          <div class="password-input-wrap">
            <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" maxlength="15" autocomplete="off" class="profile-input" />
            <button type="button" class="eye-btn" (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'">
              <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12c1.8-5 6-8 10-8s8.2 3 10 8c-1.8 5-6 8-10 8s-8.2-3-10-8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"></circle>
              </svg>
              <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                <path d="M4.5 8.5C6.4 5.9 9 4 12 4c4 0 8.2 3 10 8-.7 1.9-1.7 3.5-3 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M9.9 9.9A3.2 3.2 0 0 0 9 12c0 1.7 1.3 3 3 3 .7 0 1.4-.2 2-.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              </svg>
            </button>
          </div>
        </section>

        <div class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="feedback success" *ngIf="message">{{ message }}</div>

        <div class="action-row">
          <button type="submit" class="save-btn" [disabled]="saving">
            {{ saving ? 'Saving...' : 'Change Password' }}
          </button>
        </div>
      </form>
    </section>
  </div>
</section>
