<section class="password-page">
  <div class="container password-shell">
    <section class="password-card">
      <div class="panel-head">
        <div>
          <h1>Change Password</h1>
          <p>Update your Shohoz account password</p>
        </div>
      </div>

      <div class="field-grid">
        <label>
          <span>Current Password</span>
          <input type="password" [(ngModel)]="currentPassword" placeholder="Enter current password" />
        </label>
        <label>
          <span>New Password</span>
          <input type="password" [(ngModel)]="newPassword" placeholder="Enter new password" />
        </label>
        <label>
          <span>Confirm Password</span>
          <input type="password" [(ngModel)]="confirmPassword" placeholder="Re-enter new password" />
        </label>
      </div>

      <div class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="feedback success" *ngIf="message">{{ message }}</div>

      <button type="button" class="save-btn" (click)="savePassword()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save Password' }}
      </button>
    </section>
  </div>
</section>
