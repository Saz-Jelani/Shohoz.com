<div class="panel rounded-4 p-4 h-100">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="section-title mb-0">Popular Routes</h3>
    <small class="muted">Updated just now</small>
  </div>
  <div class="route-list">
    <article class="route-item" *ngFor="let route of popularRoutes">
      <div>
        <h4 class="route-name mb-1">{{ route.from }} to {{ route.to }}</h4>
        <p class="mb-0 muted">Departure: {{ route.departure }}</p>
      </div>
      <div class="text-end">
        <p class="fare mb-1">{{ route.fare }}</p>
        <p class="mb-0 muted">{{ route.seatsLeft }} seats left</p>
      </div>
    </article>
  </div>
</div>
