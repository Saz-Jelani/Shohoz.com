<div class="layout-shell">
  <app-header
    [travelModes]="travelModes"
    [selectedMode]="selectedMode"
    (modeChange)="onModeChange($event)"
    (serviceClick)="onServiceClick($event)"
  ></app-header>
  <main class="layout-content">
    <router-outlet></router-outlet>
  </main>
  <app-footer *ngIf="showFooter"></app-footer>

  <div class="global-toast-backdrop" *ngIf="showSuccessToast"></div>
  <div class="global-success-toast" *ngIf="showSuccessToast">
    <div class="success-icon" aria-hidden="true">
      <svg viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="24"></circle>
        <path d="M14 27.5l8 8 16-18"></path>
      </svg>
    </div>
    <p class="success-line-1">{{ successToastLine1 }}</p>
    <p class="success-line-2">{{ successToastLine2 }}</p>
  </div>
</div>
